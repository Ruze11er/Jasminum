<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Your cozy, offline-first home for tasks, notes, calendar and study files."
    />
    <meta name="theme-color" content="#FFF5F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1519" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jasminum" />
    <title>Jasminum</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('jasminum-ui') || '{}').state;
        var t = (s && s.theme) || 'system';
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
